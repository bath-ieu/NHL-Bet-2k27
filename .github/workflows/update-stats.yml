name: Auto Update NHL Stats

on:
  schedule:
    # S'exécute automatiquement à chaque heure
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch NHL Stats
        run: |
          python -c "
          import urllib.request, json

          player_ids = [
              8482671, 8482083, 8477956, 8475184, 8480018, 
              8483457, 8483515, 8484140, 8482088, 8481559, 
              8479318, 8476468, 8480893, 8484230, 8486067, 
              8480843, 8478048, 8482093, 8478550, 8479314, 
              8484157, 8480829, 8483492, 8477493, 8484972, 
              8475810, 8479425, 8484803, 8479333, 8481522, 
              8480027, 8478427
          ]
          stats = {}

          # 1. Fetch Statistiques Joueurs
          for pid in player_ids:
              url = f'https://api-web.nhle.com/v1/player/{pid}/landing'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req) as response:
                      data = json.loads(response.read().decode())
                      pts, gp = 0, 0
                      if 'featuredStats' in data and 'regularSeason' in data['featuredStats'] and 'subSeason' in data['featuredStats']['regularSeason']:
                          sub = data['featuredStats']['regularSeason']['subSeason']
                          pts = sub.get('points', sub.get('wins', 0))
                          gp = sub.get('gamesPlayed', 0)
                      elif 'seasonTotals' in data:
                          reg = [s for s in data['seasonTotals'] if s.get('gameTypeId') == 2]
                          if reg:
                              last = reg[-1]
                              pts = last.get('points', last.get('wins', 0))
                              gp = last.get('gamesPlayed', 0)
                      stats[str(pid)] = {'points': pts, 'gp': gp}
              except Exception as e:
                  print(f'Error for {pid}: {e}')
                  stats[str(pid)] = {'points': 0, 'gp': 0}

          # 2. Fetch Classement des Équipes (Saison Régulière)
          try:
              url_standings = 'https://api-web.nhle.com/v1/standings/now'
              req_s = urllib.request.Request(url_standings, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req_s) as response:
                  s_data = json.loads(response.read().decode())
                  for team_info in s_data.get('standings', []):
                      abbrev = team_info.get('teamAbbrev', {}).get('default')
                      if abbrev in ['MTL', 'FLA']:
                          stats[abbrev] = {
                              'points': team_info.get('points', 0),
                              'gp': team_info.get('gamesPlayed', 0)
                          }
          except Exception as e:
              print(f'Error fetching team standings: {e}')
              stats['MTL'] = {'points': 0, 'gp': 0}
              stats['FLA'] = {'points': 0, 'gp': 0}

          # 3. Initialisation des Séries Éliminatoires
          stats['MTL_PLAYOFF'] = {'points': 0, 'gp': 0}
          stats['FLA_PLAYOFF'] = {'points': 0, 'gp': 0}

          with open('stats.json', 'w') as f:
              json.dump(stats, f, indent=2)
          "

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]"
          git add stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NHL stats" && git push)
