name: Auto Update NHL Stats

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch NHL Stats
        run: |
          python -c "
          import urllib.request, json

          player_ids = [
              8482671, 8482142, 8477956, 8475184, 8480018, 
              8483457, 8483515, 8484387, 8482109, 8481559, 
              8479318, 8476468, 8480893, 8484230, 8486067, 
              8480843, 8478048, 8482116, 8478550, 8479314, 
              8484153, 8480801, 8483445, 8477493, 8475158, 
              8475810, 8479425, 8484873, 8479410, 8481524, 
              8480027, 8478427
          ]
          stats = {}
          player_teams = {}

          # 1. Fetch Statistiques des Joueurs + Équipe actuelle
          for pid in player_ids:
              url = f'https://api-web.nhle.com/v1/player/{pid}/landing'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req) as response:
                      data = json.loads(response.read().decode())
                      pts, gp = 0, 0
                      team_abbrev = data.get('currentTeamAbbrev', '')
                      if team_abbrev:
                          player_teams[pid] = team_abbrev

                      if 'featuredStats' in data and 'regularSeason' in data['featuredStats'] and 'subSeason' in data['featuredStats']['regularSeason']:
                          sub = data['featuredStats']['regularSeason']['subSeason']
                          pts = sub.get('points', sub.get('wins', 0))
                          gp = sub.get('gamesPlayed', 0)
                      elif 'seasonTotals' in data:
                          reg = [s for s in data['seasonTotals'] if s.get('gameTypeId') == 2]
                          if reg:
                              last = reg[-1]
                              pts = last.get('points', last.get('wins', 0))
                              gp = last.get('gamesPlayed', 0)
                      stats[str(pid)] = {'points': pts, 'gp': gp, 'injured': False}
              except Exception as e:
                  print(f'Error for {pid}: {e}')
                  stats[str(pid)] = {'points': 0, 'gp': 0, 'injured': False}

          # 2. Vérification des Alignements Actifs (Méthode 3)
          unique_teams = set(player_teams.values())
          active_roster_pids = set()

          for team in unique_teams:
              try:
                  r_url = f'https://api-web.nhle.com/v1/roster/{team}/current'
                  r_req = urllib.request.Request(r_url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(r_req) as response:
                      r_data = json.loads(response.read().decode())
                      for pos_group in ['forwards', 'defensemen', 'goalies']:
                          for p in r_data.get(pos_group, []):
                              active_roster_pids.add(p.get('id'))
              except Exception as e:
                  print(f'Error fetching roster for {team}: {e}')

          # Marquage des joueurs absents/blessés
          for pid in player_ids:
              if pid in player_teams and pid not in active_roster_pids:
                  stats[str(pid)]['injured'] = True

          # 3. Fetch Classement des Équipes
          try:
              url_standings = 'https://api-web.nhle.com/v1/standings/now'
              req_s = urllib.request.Request(url_standings, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req_s) as response:
                  s_data = json.loads(response.read().decode())
                  for team_info in s_data.get('standings', []):
                      abbrev = team_info.get('teamAbbrev', {}).get('default')
                      if abbrev in ['MTL', 'FLA']:
                          stats[abbrev] = {
                              'points': team_info.get('points', 0),
                              'gp': team_info.get('gamesPlayed', 0),
                              'injured': False
                          }
          except Exception as e:
              print(f'Error fetching team standings: {e}')
              stats['MTL'] = {'points': 0, 'gp': 0, 'injured': False}
              stats['FLA'] = {'points': 0, 'gp': 0, 'injured': False}

          # 4. Initialisation Séries Éliminatoires
          stats['MTL_PLAYOFF'] = {'points': 0, 'gp': 0, 'injured': False}
          stats['FLA_PLAYOFF'] = {'points': 0, 'gp': 0, 'injured': False}

          with open('stats.json', 'w') as f:
              json.dump(stats, f, indent=2)
          "

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NHL stats with injury detection" && git push)
