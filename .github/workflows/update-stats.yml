Name: Auto Update NHL Stats

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch NHL Stats
        run: |
          python -c "
          import urllib.request, json

          player_ids = [
              8482671, 8482142, 8477956, 8475184, 8481618, 8480018, 
              8483457, 8483515, 8484387, 8482109, 8481559, 
              8479318, 8476468, 8480893, 8484230, 8486067, 
              8480843, 8478048, 8482116, 8478550, 8479314, 
              8484153, 8480801, 8483445, 8477493, 8475158, 
              8475810, 8479425, 8484873, 8482077, 8483516, 
              8479410, 8481524, 8480027, 8478427
          ]
          stats = {}
          CURRENT_SEASON = 20262027

          # 1. Fetch Statistiques des Joueurs et Historique
          for pid in player_ids:
              url = f'https://api-web.nhle.com/v1/player/{pid}/landing'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req) as response:
                      data = json.loads(response.read().decode())
                      pts, gp = 0, 0
                      history = []
                      position = data.get('position', 'F')

                      # Récupération de l'historique des saisons régulières
                      for s in data.get('seasonTotals', []):
                          if s.get('gameTypeId') == 2:
                              s_pts = s.get('points', s.get('wins', 0)) or 0
                              s_gp = s.get('gamesPlayed', 0) or 0
                              s_season = s.get('season')
                              if s_gp > 0:
                                  history.append({'season': s_season, 'points': s_pts, 'gamesPlayed': s_gp})

                      # Recherche stricte dans la saison 2026-27
                      reg_2026 = [s for s in data.get('seasonTotals', []) if s.get('gameTypeId') == 2 and s.get('season') == CURRENT_SEASON]

                      if reg_2026:
                          last_stat = reg_2026[-1]
                          pts = last_stat.get('points', last_stat.get('wins', 0)) or 0
                          gp = last_stat.get('gamesPlayed', 0) or 0
                      elif 'featuredStats' in data and 'regularSeason' in data['featuredStats']:
                          reg_feat = data['featuredStats']['regularSeason']
                          if reg_feat.get('season') == CURRENT_SEASON and 'subSeason' in reg_feat:
                              sub = reg_feat['subSeason']
                              pts = sub.get('points', sub.get('wins', 0)) or 0
                              gp = sub.get('gamesPlayed', 0) or 0

                      stats[str(pid)] = {'points': pts, 'gp': gp, 'position': position, 'history': history}
              except Exception as e:
                  print(f'Error for {pid}: {e}')
                  stats[str(pid)] = {'points': 0, 'gp': 0, 'position': 'F', 'history': []}

          # 2. Fetch Classement des Équipes
          try:
              url_standings = 'https://api-web.nhle.com/v1/standings/now'
              req_s = urllib.request.Request(url_standings, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req_s) as response:
                  s_data = json.loads(response.read().decode())
                  for team_info in s_data.get('standings', []):
                      abbrev = team_info.get('teamAbbrev', {}).get('default')
                      if abbrev in ['MTL', 'FLA']:
                          stats[abbrev] = {
                              'points': team_info.get('points', 0),
                              'gp': team_info.get('gamesPlayed', 0),
                              'position': 'TEAM',
                              'history': []
                          }
          except Exception as e:
              print(f'Error fetching team standings: {e}')
              stats['MTL'] = {'points': 0, 'gp': 0, 'position': 'TEAM', 'history': []}
              stats['FLA'] = {'points': 0, 'gp': 0, 'position': 'TEAM', 'history': []}

          # 3. Initialisation Séries Éliminatoires
          stats['MTL_PLAYOFF'] = {'points': 0, 'gp': 0, 'position': 'TEAM', 'history': []}
          stats['FLA_PLAYOFF'] = {'points': 0, 'gp': 0, 'position': 'TEAM', 'history': []}

          with open('stats.json', 'w') as f:
              json.dump(stats, f, indent=2)
          "

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update NHL stats and historical data" && git push)
